<h1 class="text-gray margin-btm-6 section-heading" style="font-size:25px;">Thank you!</h1>

<p class="text-gray">
Your message has been sent to us. We will get back to you as soon as possible.</p>
<br>
 <p id="countdown" class="text-gray" >Bringing you back in 5...</p>
</div>

</section>



	
</body>
 <script>
    let seconds = 5;
    const el = document.getElementById("countdown");

    const interval = setInterval(() => {
      seconds--;
      el.textContent = `Bringing you back in ${seconds}...`;

      if (seconds === 0) {
        clearInterval(interval);
        window.location.href = "https://weddigraphy.co.uk/"; 
      }
    }, 1000);
  </script>
